      }
      function wayIds(line) {
        return line.ways.map(function (w) { return String(w[0]); }).join(" ");
      }
      function roadLabel(line) {
        if (line.mark !== "in" || !line.name) return "";
        if (line.name === "Clubhouse") return "Clubhouse";
        return "ซอย " + line.name;
      }
      function onTheList(line) {
        if (line.mark === "in" || line.mark === "out") return true;
        return typeof line.name === "string" && line.name.trim() !== "";
      }
      function numberField(line) {
        if (line.confirmed && typeof line.num === "number") return String(line.num);
        return "";
      }
      function markField(line) {
        if (line.mark === "in") return "In";
        if (line.mark === "out") return "Out";
        return "";
      }
      function markedRows() {
        var rows = [];
        var i;
        for (i = 0; i < lines.length; i++) {
          if (onTheList(lines[i])) rows.push(lines[i]);
        }
        rows.sort(function (a, b) {
          var an = a.confirmed && typeof a.num === "number" ? a.num : 1000000;
          var bn = b.confirmed && typeof b.num === "number" ? b.num : 1000000;
          return an - bn;
        });
        return rows.map(function (line) {
          return [numberField(line), wayIds(line), markField(line), line.name];
        });
      }
      function marksText() {
        var rows = markedRows();
        if (!rows.length) return "Nothing is marked.";
        return rows.map(function (row) { return row.join("\t"); }).join("\n");
      }
      function showList() {
        var text = marksText();
        listEl.hidden = false;
        listEl.textContent = text;
        return text;
      }
      function copyText(text) {
        function fallback() {
          var area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
          document.body.removeChild(area);
          return ok;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).then(function () {
            return true;
          }, function () {
            return fallback();
          });
        }
        return Promise.resolve(fallback());
      }
      function copyMarks() {
        copyText(marksText());
      }
      function saveMarks() {
        save();
        var text = showList();
        copyText(text).then(function (ok) {
          if (!ok) hint.textContent = "It stayed on this phone.";
        });
      }
      function strokeOf(line) {
        if (typeof line.gapAfter !== "number") return line.points;
        var at = line.gapAfter;
        if (at < 0 || at >= line.points.length - 1) return line.points;
        return [line.points.slice(0, at + 1), line.points.slice(at + 1)];
      }
      function labelPoints(line) {
        var stroke = strokeOf(line);
        if (stroke === line.points) return line.points;
        var best = stroke[0];
        var bestLen = lengthOf(best);
        var i;
        for (i = 1; i < stroke.length; i++) {
          var len = lengthOf(stroke[i]);
          if (len > bestLen) {
            best = stroke[i];
            bestLen = len;
          }
        }
        return best;
      }
      function draw() {
        group.clearLayers();
        var selectedHalo = null;
        var selectedVisible = null;
        var selectedHit = null;
        lines.forEach(function (line) {
          if (line.mark === "out") return;
          var selected = line.id === selectedId;
          var stroke = strokeOf(line);
          if (selected) {
            selectedHalo = L.polyline(stroke, {
              color: HALO, weight: 11, opacity: 1, interactive: false,
              lineCap: "round", lineJoin: "round"
            }).addTo(group);
          }
          var outside = line.mark === "out";
          var visible = L.polyline(stroke, {
            color: ROAD,
            weight: selected ? 6.5 : 2.2,
            opacity: 1,
            interactive: false,
            dashArray: outside ? "7 7" : null,
            lineCap: "round",
            lineJoin: "round"
          });
          var hit = L.polyline(stroke, {
            color: ROAD, weight: selected && cutArmed ? 22 : 16, opacity: 0,
            lineCap: "round", lineJoin: "round"
          });
          hit.on("click", function (event) {
            L.DomEvent.stopPropagation(event);
            choose(line.id, event.latlng);
          });
          visible.addTo(group);
          hit.addTo(group);
          if (selected) {
            selectedVisible = visible;
            selectedHit = hit;
          }
          var labelText = roadLabel(line);
          if (labelText) {
            var at = midpoint(labelPoints(line));
            var label = document.createElement("span");
            label.textContent = labelText;
            L.tooltip({permanent: true, direction: "center", className: "road-name"})
              .setLatLng(at)
              .setContent(label)
              .addTo(group);
          }
        });
        if (selectedHalo) selectedHalo.bringToFront();
        if (selectedVisible) selectedVisible.bringToFront();
        if (selectedHit) selectedHit.bringToFront();
        showEditor();
      }
      function choose(id, latlng) {
        if (cutArmed && selectedId === id) {
          if (splitLine(id, latlng)) {
            cutArmed = false;
            save();
            draw();
            return;
          }
        }
        var again = findLine(id);
        if (!cutArmed && selectedId === id && again && again.mark === "out" && !again.confirmed) {
          releaseMark(again);
          save();
          draw();
          return;
        }
        cutArmed = false;
        selectedId = id;
        draw();
      }
      function segmentLength(points, i) {
        var a = toXY(points[i][0], points[i][1]);
        var b = toXY(points[i + 1][0], points[i + 1][1]);
        return Math.hypot(b[0] - a[0], b[1] - a[1]);
      }
      function strokedLength(points, gapAfter) {
        var total = 0;
        var i;
        for (i = 0; i < points.length - 1; i++) {
          if (i === gapAfter) continue;
          total += segmentLength(points, i);
        }
        return total;
      }
      function cutFraction(points, segIndex, t, gapAfter) {
        var total = strokedLength(points, gapAfter);
        if (total <= 0) return 0;
        var walked = 0;
        var i;
        for (i = 0; i < segIndex; i++) {
          if (i === gapAfter) continue;
          walked += segmentLength(points, i);
        }
        walked += t * segmentLength(points, segIndex);
        return walked / total;
      }
      function assignGap(piece, southPt, northPt) {
        var i;
        for (i = 0; i < piece.points.length - 1; i++) {
          if (piece.points[i] === southPt && piece.points[i + 1] === northPt) {
            piece.gapAfter = i;
            return;
          }
        }
      }
      function sliceWays(ways, frac, side) {
        var out = [];
        var i;
        for (i = 0; i < ways.length; i++) {
          var id = ways[i][0];
          var a = ways[i][1];
          var b = ways[i][2];
          if (side === "left") {
            if (a >= frac) continue;
            var hi = Math.min(b, frac);
            if (hi <= a) continue;
            out.push([id, a / frac, hi / frac]);
          } else {
            if (b <= frac) continue;
            var lo = Math.max(a, frac);
            var span = 1 - frac;
            if (span <= 0 || b <= lo) continue;
            out.push([id, (lo - frac) / span, (b - frac) / span]);
          }
        }
        return out;
      }
      function splitLine(id, latlng) {
        var index = -1;
        var i;
        for (i = 0; i < lines.length; i++) {
          if (lines[i].id === id) index = i;
        }
        if (index < 0) return false;
        var line = lines[index];
        var gapAfter = typeof line.gapAfter === "number" ? line.gapAfter : -1;
        var click = toXY(latlng.lat, latlng.lng);
        var best = null;
        for (i = 0; i < line.points.length - 1; i++) {
          if (i === gapAfter) continue;
          var a = toXY(line.points[i][0], line.points[i][1]);
          var b = toXY(line.points[i + 1][0], line.points[i + 1][1]);
          var hit = project(click[0], click[1], a[0], a[1], b[0], b[1]);
          if (!best || hit.d < best.d) best = {i: i, t: hit.t, d: hit.d, x: hit.x, y: hit.y};
        }
        if (!best || best.d > 120) return false;
        var cutLL = fromXY(best.x, best.y);
        cutLL = [Math.round(cutLL[0] * 1e6) / 1e6, Math.round(cutLL[1] * 1e6) / 1e6];
        var left;
        var right;
        if (best.t <= 0.0001) {
          left = line.points.slice(0, best.i + 1);
          right = line.points.slice(best.i);
        } else if (best.t >= 0.9999) {
          left = line.points.slice(0, best.i + 2);
          right = line.points.slice(best.i + 1);
        } else {
          left = line.points.slice(0, best.i + 1).concat([cutLL]);
          right = [cutLL].concat(line.points.slice(best.i + 1));
        }
        if (left.length < 2 || right.length < 2) return false;
        var gapSouth = gapAfter >= 0 ? line.points[gapAfter] : null;
        var gapNorth = gapAfter >= 0 ? line.points[gapAfter + 1] : null;
        var leftGap = -1;
        var rightGap = -1;
        if (gapSouth) {
          var probeL = {points: left};
          var probeR = {points: right};
          assignGap(probeL, gapSouth, gapNorth);
          assignGap(probeR, gapSouth, gapNorth);
          if (typeof probeL.gapAfter === "number") leftGap = probeL.gapAfter;
          if (typeof probeR.gapAfter === "number") rightGap = probeR.gapAfter;
        }
        var leftLen = strokedLength(left, leftGap);
        var rightLen = strokedLength(right, rightGap);
        if (leftLen < MIN_PIECE_M || rightLen < MIN_PIECE_M) return false;
        var leftLonger = leftLen >= rightLen;
        var frac = cutFraction(line.points, best.i, best.t, gapAfter);
        var leftLine = {
          id: line.id + "a",
          name: leftLonger ? line.name : "",
          mark: leftLonger ? line.mark : "",
          confirmed: leftLonger ? line.confirmed : false,
          num: leftLonger ? line.num : null,
          ways: sliceWays(line.ways, frac, "left"),
          points: left
        };
        var rightLine = {
          id: line.id + "b",
          name: leftLonger ? "" : line.name,
          mark: leftLonger ? "" : line.mark,
          confirmed: leftLonger ? false : line.confirmed,
          num: leftLonger ? null : line.num,
          ways: sliceWays(line.ways, frac, "right"),
          points: right
        };
        if (leftGap >= 0) leftLine.gapAfter = leftGap;
        if (rightGap >= 0) rightLine.gapAfter = rightGap;
        if (!leftLine.ways.length) leftLine.ways = cloneWays(line.ways);
        if (!rightLine.ways.length) rightLine.ways = cloneWays(line.ways);
        lines.splice(index, 1, leftLine, rightLine);
        if (!line.name && !line.mark) selectedId = best.t >= 0.5 ? rightLine.id : leftLine.id;
        else selectedId = leftLonger ? rightLine.id : leftLine.id;
        return true;
      }

      nameInput.addEventListener("input", function () {
        var line = findLine(selectedId);
        if (!line) return;
        line.name = nameInput.value;
        save();
        draw();
      });
      cutButton.addEventListener("click", function () {
        if (!selectedId) return;
        cutArmed = !cutArmed;
        draw();
      });
      markIn.addEventListener("click", function () { setMark("in"); });
      markOut.addEventListener("click", function () { setMark("out"); });
      clearButton.addEventListener("click", clearOutside);
      confirmButton.addEventListener("click", confirmMark);
      copyButton.addEventListener("click", copyMarks);
      saveButton.addEventListener("click", saveMarks);

      draw();
      var bounds = L.latLngBounds(BUILT.reduce(function (all, line) {
        return all.concat(line.points);
      }, []));
      map.fitBounds(bounds, {padding: [16, 16]});
    })();
  </script>
</body>
</html>
